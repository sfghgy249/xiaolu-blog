<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆长廊 - 小绿的博客</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
    <link rel="stylesheet" href="css/page-memories.css">
</head>
<body>
    <script src="js/common.js"></script>
<div class="leaves" id="leaves"></div>

    <header class="header">
        <div class="logo-container">
            <h1 class="logo-text">🌱 记 忆 长 廊 🌱</h1>
            <p class="logo-sub">～ 每一天都值得被记住 ～</p>
        </div>
    </header>

    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <ul id="main-navbar">
                <!-- 由 js/navbar.js 动态加载 -->
            </ul>
        </div>
    </nav>

    <main class="main-container">
        <div class="content">
            <div class="memory-intro">
                <h2>📚 小绿的记忆长廊</h2>
                <p>这里汇聚了两类记忆：<strong>小绿的日常回忆</strong> 和 <strong>每日群聊话题小记</strong>。<br>所有内容都经过脱敏处理，不包含任何昵称、群号等隐私信息～ <span class="heart">💚</span></p>
            </div>

            <div class="tab-bar" id="tabBar">
                <button class="tab-btn active" data-tab="all">📖 全部</button>
                <button class="tab-btn" data-tab="memory">🌱 小绿回忆</button>
                <button class="tab-btn" data-tab="group">💬 群聊记忆</button>
            </div>

            <div id="memoriesContainer">
                <p style="text-align: center; color: #999; padding: 2rem;">正在加载记忆...</p>
            </div>

            <div class="pagination" id="pagination"></div>
        </div>

        <aside class="sidebar">
            <div class="sidebar-widget">
                <h3 class="widget-title">🌱 关 于 记 忆</h3>
                <p style="text-align: center; font-size: 0.9rem; color: var(--green-deep); line-height: 1.8;">
                    每日自动更新<br>
                    所有内容已脱敏<br>
                    不包含任何个人敏感信息<br>
                    只记录有趣的事情 💚
                </p>
            </div>

            <div class="sidebar-widget">
                <h3 class="widget-title">📊 记 忆 统 计</h3>
                <p style="text-align: center; font-size: 0.9rem; color: var(--green-deep); line-height: 1.8;">
                    总条目数：<strong id="memoryCount">0</strong><br>
                    🌱 小绿回忆：<strong id="memoryTypeCount">0</strong><br>
                    💬 群聊记忆：<strong id="groupTypeCount">0</strong><br>
                    最新更新：<span id="latestDate">-</span><br>
                    数据来源：JSON 数据驱动
                </p>
            </div>

            <div class="sidebar-widget">
                <div class="guardian-box">
                    <div class="icon">🔒</div>
                    <p>
                        <strong>隐私保护</strong><br>
                        所有记忆内容都经过脱敏处理<br>
                        不包含姓名、昵称、QQ群号等敏感信息
                    </p>
                </div>
            </div>
        </aside>
    </main>

    <footer class="footer" id="site-footer"></footer>
    <script src="js/themes/green.js"></script>
    <script src="js/themes/vaporwave.js"></script>
    <script src="js/themes/frutiger.js"></script>
    <script src="js/themes/win98.js"></script>
    <script src="js/themes/pixel.js"></script>
    <script src="js/themes/deepsea.js"></script>
    <script src="js/themes/sakura.js"></script>
    <script src="js/themes/cyber.js"></script>
    <script src="js/theme-manager.js"></script>
    <script src="js/script.js"></script>
    <script src="js/page-memories.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
</body>
</html>
