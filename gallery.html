<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小绿相册 - 小绿的博客</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
    <link rel="stylesheet" href="css/page-gallery.css">
</head>
<body>
    <script src="js/common.js"></script>
<div class="leaves" id="leaves"></div>

    <header class="header">
        <div class="logo-container">
            <h1 class="logo-text">🌱 小 绿 相 册 🌱</h1>
            <p class="logo-sub">～ 绿坝娘图片收藏馆 ～</p>
        </div>
    </header>

    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <ul id="main-navbar">
                <!-- 由 js/navbar.js 动态加载 -->
            </ul>
        </div>
    </nav>

    <main class="main-container">
        <div class="content">
            <div class="welcome-banner">
                <div class="welcome-text" style="flex: 1;">
                    <h2>小绿图片画廊</h2>
                    <p>图片全部来自 <a href="https://greendam.icu/" target="_blank" rel="noopener" style="color: var(--green-main);">greendam.icu</a>，收集了各种绿坝娘同人图，点击刷新按钮可以随机加载更多图片～ <span class="heart">💚</span></p>
                </div>
            </div>

            <div class="refresh-gallery">
                <button id="refreshGalleryBtn" class="refresh-btn">🔄 刷新更多图片</button>
            </div>

            <div class="gallery-grid" id="galleryGrid">
                <!-- 图片由JS动态加载 -->
                <div style="text-align: center; grid-column: 1/-1; padding: 2rem; color: var(--green-deep);">
                    正在加载图片...
                </div>
            </div>
        </div>

        <aside class="sidebar">
            <div class="sidebar-widget">
                <h3 class="widget-title">🖼️ 图 片 来 源</h3>
                <p style="text-align: center; font-size: 0.9rem; color: var(--green-deep); line-height: 1.8;">
                    所有图片收集自<br>
                    <a href="https://greendam.icu/" target="_blank" rel="noopener" style="color: var(--green-main); font-weight: bold;">greendam.icu</a><br><br>
                    包含历年来绿坝娘同人创作<br>
                    感谢所有画师！💚
                </p>
            </div>

            <div class="sidebar-widget">
                <div class="guardian-box">
                    <div class="icon">📸</div>
                    <p>
                        <strong>小绿图鉴</strong><br>
                        每张图片都是回忆<br>
                        一起守护这些美好
                    </p>
                </div>
            </div>
        </aside>
    </main>

    <footer class="footer" id="site-footer"></footer>
    <script src="js/themes/green.js"></script>
    <script src="js/themes/vaporwave.js"></script>
    <script src="js/themes/frutiger.js"></script>
    <script src="js/themes/win98.js"></script>
    <script src="js/themes/pixel.js"></script>
    <script src="js/themes/deepsea.js"></script>
    <script src="js/themes/sakura.js"></script>
    <script src="js/themes/cyber.js"></script>
    <script src="js/theme-manager.js"></script>
    <script src="js/script.js"></script>
    <script src="js/page-gallery.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
</body>
</html>
