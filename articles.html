<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章列表 - 小绿的博客</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
</head>
<body>
    <script src="js/common.js"></script>
<div class="leaves" id="leaves"></div>

    <header class="header">
        <div class="logo-container">
            <h1 class="logo-text">🌱 文 章 列 表 🌱</h1>
            <p class="logo-sub">～ 小绿的博客文章合集 ～</p>
        </div>
    </header>

    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <ul id="main-navbar">
                <!-- 由 js/navbar.js 动态加载 -->
            </ul>
        </div>
    </nav>

    <main class="main-container">
        <div class="content">
            <div id="articlesContainer">
                <!-- 文章由JS动态加载 -->
            </div>

            <div class="pagination" id="pagination">
                <!-- 分页由JS动态生成 -->
            </div>
        </div>

        <aside class="sidebar">
            <div class="sidebar-widget">
                <h3 class="widget-title">🌱 关 于 我 🌱</h3>
                <div class="profile-avatar">
                    <img src="img/xiaolu_avatar.jpg" alt="小绿头像" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                </div>
                <p class="profile-name">小绿（格林达姆）</p>
                <p class="profile-bio">
                    绿坝-花季护航形象<br>
                    生日：2009年6月11日<br>
                    喜欢：绿色、大自然、小朋友<br>
                    不喜欢：不良信息 💚
                </p>
            </div>

            <div class="sidebar-widget">
                <h3 class="widget-title">📊 文 章 统 计</h3>
                <p style="text-align: center; font-size: 0.9rem; color: var(--green-deep); line-height: 1.8;">
                    总文章数：<strong id="totalCount">0</strong> 篇<br>
                    每页显示：6 篇<br>
                    共 <strong id="totalPages">0</strong> 页
                </p>
            </div>

            <div class="sidebar-widget">
                <h3 class="widget-title">🏷️ 文 章 分 类</h3>
                <div class="tag-cloud" id="tagCloud">
                    <!-- 标签由JS动态生成 -->
                </div>
            </div>
        </aside>
    </main>

    <footer class="footer" id="site-footer"></footer>
    <script src="js/themes/green.js"></script>
    <script src="js/themes/vaporwave.js"></script>
    <script src="js/themes/frutiger.js"></script>
    <script src="js/themes/win98.js"></script>
    <script src="js/themes/pixel.js"></script>
    <script src="js/themes/deepsea.js"></script>
    <script src="js/themes/sakura.js"></script>
    <script src="js/themes/cyber.js"></script>
    <script src="js/theme-manager.js"></script>
    <script src="js/script.js"></script>
    <script src="js/page-articles.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
</body>
</html>
