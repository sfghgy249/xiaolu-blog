<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频专栏 - 小绿的博客</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
    <link rel="stylesheet" href="css/page-video.css">
</head>
<body>
    <script src="js/common.js"></script>
<div class="leaves" id="leaves"></div>

    <header class="header">
        <div class="logo-container">
            <h1 class="logo-text">🎬 视 频 专 栏 🎬</h1>
            <p class="logo-sub">～ B站绿坝娘相关视频合集 ～</p>
        </div>
    </header>

    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <ul id="main-navbar">
                <!-- 由 js/navbar.js 动态加载 -->
            </ul>
        </div>
    </nav>

    <main class="main-container">
        <div class="content">
            <div class="video-intro">
                <h2>🌿 绿 坝 娘 视 频 收 藏</h2>
                <p>这里收集了B站上绿坝娘相关的同人视频、音乐、手书、科普作品。<br>定期从B站抓取绿坝娘标签下的最新优质内容更新哦～ <span class="heart">💚</span></p>
            </div>

            <div id="videosContainer">
                <!-- 视频由JS动态加载 -->
            </div>

            <div class="pagination" id="pagination">
                <!-- 分页由JS动态生成 -->
            </div>
        </div>

        <aside class="sidebar">
            <div class="sidebar-widget">
                <h3 class="widget-title">📺 视 频 统 计</h3>
                <p style="text-align: center; font-size: 0.9rem; color: var(--green-deep); line-height: 1.8;">
                    收录视频：<strong id="totalCount">0</strong> 个<br>
                    每页显示：4 个<br>
                    共 <strong id="totalPages">0</strong> 页<br>
                    数据来源：B站
                </p>
            </div>

            <div class="sidebar-widget">
                <h3 class="widget-title">🔍 更 多 视 频</h3>
                <p style="font-size: 0.9rem; color: var(--green-deep); line-height: 1.8; text-align: center;">
                    想去B站看更多？<br>
                    <a href="https://search.bilibili.com/all?keyword=绿坝娘" target="_blank" style="color: var(--green-main); font-weight: 500;">
                        点我前往B站搜索 →
                    </a>
                </p>
            </div>

            <div class="sidebar-widget">
                <div class="guardian-box">
                    <div class="icon">💚</div>
                    <p>
                        <strong>提示</strong><br>
                        视频内容来自B站<br>
                        版权归原UP主所有<br>
                        喜欢请去B站支持原作者
                    </p>
                </div>
            </div>
        </aside>
    </main>

    <footer class="footer" id="site-footer"></footer>
    <script src="js/themes/green.js"></script>
    <script src="js/themes/vaporwave.js"></script>
    <script src="js/themes/frutiger.js"></script>
    <script src="js/themes/win98.js"></script>
    <script src="js/themes/pixel.js"></script>
    <script src="js/themes/deepsea.js"></script>
    <script src="js/themes/sakura.js"></script>
    <script src="js/themes/cyber.js"></script>
    <script src="js/theme-manager.js"></script>
    <script src="js/script.js"></script>
    <script src="js/page-video.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
</body>
</html>
