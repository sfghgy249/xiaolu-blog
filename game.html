<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小绿吃豆人 - 博客小游戏</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/page-game.css">
</head>
<body>
    <script src="js/common.js"></script>
<!-- 飘落叶子（复用博客动画） -->
    <div class="leaves" id="leaves"></div>

    <!-- 头部 -->
    <header class="header">
        <div class="logo-container">
            <h1 class="logo-text">🌱 小绿吃豆人 🌱</h1>
            <p class="logo-sub">～ 吃豆子大赛 · 躲避幽灵 ～</p>
        </div>
    </header>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <ul id="main-navbar">
                <li><a href="index.html">🏠 返回博客首页</a></li>
                <li><a href="#" class="active">🎮 小游戏</a></li>
            </ul>
        </div>
    </nav>

    <!-- 游戏区域 -->
    <main class="game-container">
        <div class="score-board">
            <div>得分: <span id="score">0</span></div>
            <div>剩余豆子: <span id="pellets">0</span></div>
            <div>生命: <span id="lives">3</span></div>
        </div>

        <canvas id="gameCanvas" width="560" height="600"></canvas>

        <!-- 移动端虚拟方向键 -->
        <div class="mobile-controls">
            <button class="mobile-btn" id="btnUp">↑</button><br>
            <button class="mobile-btn" id="btnLeft">←</button>
            <button class="mobile-btn" id="btnDown">↓</button>
            <button class="mobile-btn" id="btnRight">→</button>
        </div>

        <div class="game-controls">
            <h3>🎯 操作说明</h3>
            <div class="control-hint">
                <div><span class="key">↑ ↓ ← →</span> 方向键控制移动</div>
                <div>🟢 吃掉所有豆子获胜</div>
                <div>👻 躲避粉色幽灵</div>
                <div>💚 共3条生命</div>
            </div>
            <div>
                <button id="startBtn" class="game-btn">▶ 开始游戏</button>
                <button id="restartBtn" class="game-btn" style="display: none;">🔄 重新开始</button>
            </div>
        </div>
    </main>

    <!-- 游戏结束弹窗 -->
    <div class="game-message" id="gameMessage">
        <h2 id="messageTitle"></h2>
        <p id="messageText"></p>
        <button id="playAgainBtn" class="game-btn">🔄 再玩一次</button>
        <a href="index.html" class="game-btn back-btn">🏠 返回博客</a>
    </div>

<footer class="footer" id="site-footer"></footer>
    <script src="js/themes/green.js"></script>
    <script src="js/themes/vaporwave.js"></script>
    <script src="js/themes/frutiger.js"></script>
    <script src="js/themes/win98.js"></script>
    <script src="js/themes/pixel.js"></script>
    <script src="js/themes/deepsea.js"></script>
    <script src="js/themes/sakura.js"></script>
    <script src="js/themes/cyber.js"></script>
    <script src="js/theme-manager.js"></script>
    <script src="js/script.js"></script>
    <script src="js/pacman.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
</body>
</html>
